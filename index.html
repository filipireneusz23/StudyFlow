<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101218" />
    <title>StudyFlow · 3.0</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="academic-calendar.js" defer></script>
    <script src="classroom.js" defer></script>
    <script src="timetable.js" defer></script>
    <script src="timetable-ui.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <aside id="sidebar">
      <a class="brand" href="#dashboard"
        ><span class="logo">S</span> StudyFlow <small>3.0</small></a
      >
      <p class="nav-label">TU ESPACIO DE ESTUDIO</p>
      <nav aria-label="Principal">
        <a href="#dashboard" data-view="dashboard">◈ Panel principal</a
        ><a href="#tasks" data-view="tasks">☑ Tareas <b id="navCount">0</b></a
        ><a href="#calendar" data-view="calendar">▦ Calendario</a
        ><a href="#timetable" data-view="timetable">◷ Horario</a
        ><a href="#subjects" data-view="subjects">▤ Asignaturas</a
        ><a href="#settings" data-view="settings">⚙ Ajustes</a>
      </nav>
      <div class="sidebar-bottom">
        ● Guardado en este navegador
        <p>Tu próximo objetivo empieza aquí.</p>
      </div>
    </aside>
    <div class="workspace">
      <header>
        <button
          id="menu"
          class="secondary"
          aria-label="Abrir menú"
          aria-expanded="false"
        >
          ☰</button
        ><span id="breadcrumb"></span
        ><span class="header-right">✦ Un paso más cerca de tus metas</span>
      </header>
      <main id="main"></main>
      <footer>StudyFlow 3.0 <span>Organiza. Avanza. Consíguelo.</span></footer>
    </div>
    <dialog id="editor">
      <form id="itemForm">
        <div class="section-head">
          <h2 id="dialogTitle"></h2>
          <button
            type="button"
            id="closeDialog"
            class="secondary"
            aria-label="Cerrar"
          >
            ×
          </button>
        </div>
        <label
          >Nombre<input
            name="name"
            required
            maxlength="120"
            placeholder="¿Qué tienes que preparar?" /></label
        ><label>Asignatura<select name="subject" required></select></label
        ><label>Fecha<input name="date" type="date" required /></label
        ><label id="priorityField"
          >Prioridad<select name="priority">
            <option value="high">Alta</option>
            <option value="medium" selected>Media</option>
            <option value="low">Baja</option>
          </select></label
        >
        <div class="actions">
          <button type="button" class="secondary" id="cancelDialog">
            Cancelar</button
          ><button type="submit">Guardar</button>
        </div>
      </form>
    </dialog>
    <dialog id="dayDetails" aria-labelledby="dayTitle">
      <div class="section-head">
        <h2 id="dayTitle"></h2>
        <button
          type="button"
          id="closeDay"
          class="secondary"
          aria-label="Cerrar detalles"
        >
          ×
        </button>
      </div>
      <div id="dayReasons"></div>
      <div class="actions">
        <button id="dayTask">＋ Nueva tarea</button
        ><button id="dayExam" class="secondary">＋ Examen</button>
      </div>
    </dialog>
    <dialog id="classroomDetails" aria-labelledby="classroomTaskTitle">
      <div class="section-head">
        <h2 id="classroomTaskTitle"></h2>
        <button
          id="closeClassroomDetails"
          type="button"
          class="secondary"
          aria-label="Cerrar actividad"
        >
          ×
        </button>
      </div>
      <div id="classroomTaskBody"></div>
    </dialog>
    <dialog id="ttDialog" aria-labelledby="ttTitle">
      <form id="ttForm">
        <div class="section-head">
          <h2 id="ttTitle">Nuevo bloque</h2>
          <button
            id="ttClose"
            type="button"
            class="secondary"
            aria-label="Cerrar bloque"
          >
            ×
          </button>
        </div>
        <label
          >Día<select name="day">
            <option value="1">Lunes</option>
            <option value="2">Martes</option>
            <option value="3">Miércoles</option>
            <option value="4">Jueves</option>
            <option value="5">Viernes</option>
          </select></label
        ><label
          >Tipo<select name="type">
            <option value="class">Clase</option>
            <option value="break">Recreo</option>
            <option value="free">Hora libre</option>
          </select></label
        >
        <div id="ttSubjectLabel">
          <label>Asignatura<select name="subject"></select></label
          ><button type="button" class="secondary" data-tt-action="new-subject">
            Crear asignatura
          </button>
        </div>
        <label>Inicio<input name="start" type="time" required /></label
        ><label>Fin<input name="end" type="time" required /></label
        ><label>Color<input name="color" type="color" value="#b4a3ff" /></label
        ><label>Aula (opcional)<input name="room" maxlength="120" /></label
        ><label
          >Profesor (opcional)<input name="teacher" maxlength="120"
        /></label>
        <div class="actions">
          <button type="submit">Guardar bloque</button
          ><button type="button" id="ttDelete" class="secondary">
            Eliminar bloque
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
